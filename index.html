<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyTour</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; color: #1a1a1a; line-height: 1.6; }
  header { padding: 64px 24px 48px; text-align: center; background: linear-gradient(180deg, #e8f2ff, #ffffff); }
  h1 { margin: 0 0 12px; font-size: 44px; letter-spacing: -1px; }
  p { margin: 0 auto; max-width: 560px; color: #555; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px 64px; }
  .card { border: 1px solid #e5e5e5; border-radius: 16px; padding: 24px; }
  .card h2 { margin-top: 0; font-size: 20px; }
  footer { text-align: center; padding: 24px; color: #888; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>SkyTour</h1>
  <p>홈페이지 준비 중입니다. 곧 새로운 모습으로 찾아뵙겠습니다.</p>
</header>
<main>
  <section class="card">
    <h2>준비 중</h2>
    <p>이 페이지는 외주 홈페이지 제작의 기본 셋팅 단계로 만든 임시 페이지입니다. 본 콘텐츠는 추후 업데이트될 예정입니다.</p>
  </section>
</main>
<footer>SkyTour</footer>
</body>
</html>
